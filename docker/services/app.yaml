#file: noinspection ComposeUnknownValues,ComposeUnknownValues
---
services:
    php:
        restart: unless-stopped
        environment:
            SERVER_NAME: ${SERVER_NAME:?Missing SERVER_NAME}
            DEFAULT_URI: ${DEFAULT_URI:-https://${SERVER_NAME}}
            ### Doctrine DBAL
            DATABASE_HOST: database
            DATABASE_PORT: 5432
            DATABASE_VERSION: ${POSTGRES_VERSION:-16}
            DATABASE_CHARSET: ${POSTGRES_CHARSET:-UTF8}
            DATABASE_PASSWORD_FILE: /run/secrets/postgres_password

            ### Mercure
            MERCURE_URL: ${MERCURE_URL:-http://php/.well-known/mercure}
            MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-https://${SERVER_NAME}/.well-known/mercure}
            MERCURE_JWT_SECRET: "${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}"
            MERCURE_PUBLISHER_JWT_KEY: "${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}"
            MERCURE_SUBSCRIBER_JWT_KEY: "${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}"
            MERCURE_PUBLISHER_JWT_ALG: ${MERCURE_JWT_ALG:-HS256}
            MERCURE_SUBSCRIBER_JWT_ALG: ${MERCURE_JWT_ALG:-HS256}
        secrets:
            - postgres_password

        volumes:
            - caddy_data:/data
            - caddy_config:/config
        # retirer si l'app n'a pas de database
        depends_on:
            database:
                condition: service_healthy

volumes:
    caddy_data:
    caddy_config:
