---
# Development environment override
services:
    php:
        env_file:
            -   docker/env/dev.env
        image: ${IMAGES_PREFIX:-}app-php-dev
        build:
            context: .
            target: frankenphp_dev
            args:
                USER_ID: ${USER_ID:-1000}
                GROUP_ID: ${GROUP_ID:-1000}
        ports: !override
            - name: http
              target: 80
              host_ip: ${PHP_HOST_IP:-127.0.0.1}
              published: ${PHP_HTTP_PORT:-8002}
              protocol: tcp
        volumes:
            - ./:/app
            - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
            - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro

        environment:
            FRANKENPHP_WORKER_CONFIG: watch
            FRANKENPHP_SITE_CONFIG: hot_reload
            MERCURE_EXTRA_DIRECTIVES: |
                cors_origins http://127.0.0.1:${PHP_HTTP_PORT:-8002} http://localhost:${PHP_HTTP_PORT:-8002}
            XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
            APP_ENV: "${APP_ENV:-dev}"
        extra_hosts:
            - host.docker.internal:host-gateway
        tty: true

    database:
        ports:
            - name: postgres
              target: 5432
              host_ip: ${DATABASE_HOST_IP:-127.0.0.1}
              published: ${DATABASE_PORT:-5432}
              protocol: tcp
        environment:
            POSTGRES_DB: ${DATABASE_NAME:?Missing DATABASE_NAME}
            POSTGRES_USER: ${DATABASE_USER:?Missing DATABASE_USER}

    messenger:
        image: ${IMAGES_PREFIX:-}app-php-dev
        env_file:
            - docker/env/dev.env
        volumes:
            - ./:/app

    scheduler:
        image: ${IMAGES_PREFIX:-}app-php-dev
        env_file:
            - docker/env/dev.env
        volumes:
            - ./:/app

include:
    - docker/services/mailer.yaml
