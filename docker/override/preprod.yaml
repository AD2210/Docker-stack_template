---
# Production environment override
services:
    php:
        env_file:
            -   docker/env/preprod.env
        image: ${PHP_IMAGE:-${IMAGES_PREFIX:-}app-php-preprod}:${PHP_SHA_CURRENT:-${IMAGE_TAG:-dev}}
        build:
            context: .
            target: frankenphp_prod
            args:
                APP_ENV: preprod
        ports: !override
            - name: http
              target: 80
              host_ip: ${PHP_HOST_IP:-127.0.0.1}
              published: ${PHP_HTTP_PORT:-8001}
              protocol: tcp
        environment:
            #MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
            #MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
        secrets:
            - source: symfony_decryption_key
              target: /app/config/secrets/preprod/preprod.decrypt.private.php

    database:
        environment:
            POSTGRES_DB: app-preprod
            POSTGRES_USER: preprod

    messenger:
        image: ${PHP_IMAGE:-${IMAGES_PREFIX:-}app-php-preprod}:${PHP_SHA_CURRENT:-${IMAGE_TAG:-dev}}
        secrets:
            - source: symfony_decryption_key
              target: /app/config/secrets/preprod/preprod.decrypt.private.php
        env_file:
            - docker/env/preprod.env
        environment:
            POSTGRES_DB: app-preprod
            POSTGRES_USER: preprod

    scheduler:
        image: ${PHP_IMAGE:-${IMAGES_PREFIX:-}app-php-preprod}:${PHP_SHA_CURRENT:-${IMAGE_TAG:-dev}}
        secrets:
            - source: symfony_decryption_key
              target: /app/config/secrets/preprod/preprod.decrypt.private.php
        env_file:
            - docker/env/preprod.env
        environment:
            POSTGRES_DB: app-preprod
            POSTGRES_USER: preprod

secrets:
    symfony_decryption_key:
        file: config/secrets/preprod/preprod.decrypt.private.php
