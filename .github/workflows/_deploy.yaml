name: _Deploy

on:
  workflow_call:
    inputs:
      tag:
        description: "SEMVER release tag to deploy"
        required: true
        type: string
      environment:
        description: "GitHub Environment name: preprod or production"
        required: true
        type: string
      compose_environment:
        description: "Compose environment: preprod or prod"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest

    # Configure a required reviewer on the `production` GitHub Environment.
    # The job, and therefore its production secrets, remain blocked until approval.
    environment:
      name: ${{ inputs.environment }}

    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    env:
      APP_NAME: ${{ vars.APP_NAME }}
      APP_PATH: ${{ vars.APP_PATH }}
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
      APP_URL: ${{ vars.APP_URL }}
      RELEASE_SERVICE: ${{ vars.RELEASE_SERVICE }}
      RELEASE_IMAGE: ${{ vars.RELEASE_IMAGE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail

          : "${SSH_HOST:?Missing environment secret SSH_HOST}"
          : "${SSH_USER:?Missing environment secret SSH_USER}"
          : "${APP_NAME:?Missing environment variable APP_NAME}"
          : "${APP_PATH:?Missing environment variable APP_PATH}"
          : "${COMPOSE_PROJECT_NAME:?Missing environment variable COMPOSE_PROJECT_NAME}"
          : "${APP_URL:?Missing environment variable APP_URL}"
          : "${RELEASE_SERVICE:?Missing environment variable RELEASE_SERVICE}"
          : "${RELEASE_IMAGE:?Missing environment variable RELEASE_IMAGE}"

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Prepare deployment bundle
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SYMFONY_DECRYPT_PRIVATE_KEY: ${{ secrets.SYMFONY_DECRYPT_PRIVATE_KEY }}
          COMPOSE_ENVIRONMENT: ${{ inputs.compose_environment }}
        run: |
          set -euo pipefail

          BUNDLE="${RUNNER_TEMP}/deploy"
          mkdir -p \
            "${BUNDLE}/docker/services" \
            "${BUNDLE}/docker/override" \
            "${BUNDLE}/docker/env" \
            "${BUNDLE}/secrets"

          cp compose.yaml "${BUNDLE}/"
          cp .env "${BUNDLE}/"
          cp -R docker/services/. "${BUNDLE}/docker/services/"
          cp "docker/override/${COMPOSE_ENVIRONMENT}.yaml" "${BUNDLE}/docker/override/"
          cp "docker/env/${COMPOSE_ENVIRONMENT}.env" "${BUNDLE}/docker/env/"

          # Deployment secrets are recreated on the server on every CD run.
          printf '%s' "${POSTGRES_PASSWORD}" > "${BUNDLE}/secrets/postgres_password"
          printf '%s' "${SYMFONY_DECRYPT_PRIVATE_KEY}" \
            > "${BUNDLE}/secrets/${COMPOSE_ENVIRONMENT}.decrypt.private.php"
          chmod 600 "${BUNDLE}/secrets/"*

          tar -C "${BUNDLE}" -czf "${RUNNER_TEMP}/deploy.tar.gz" .

      - name: Copy deployment bundle
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          scp "${RUNNER_TEMP}/deploy.tar.gz" \
            "${SSH_USER}@${SSH_HOST}:/tmp/${COMPOSE_PROJECT_NAME}-${{ inputs.tag }}.tar.gz"

      - name: Prepare and deploy on server
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          COMPOSE_ENVIRONMENT: ${{ inputs.compose_environment }}
        run: |
          set -euo pipefail

          printf -v REMOTE_CMD \
            'APP_NAME=%q APP_PATH=%q COMPOSE_PROJECT_NAME=%q COMPOSE_ENVIRONMENT=%q RELEASE_SERVICE=%q RELEASE_IMAGE=%q RELEASE_TAG=%q GHCR_USERNAME=%q GHCR_TOKEN=%q bash -s' \
            "${APP_NAME}" \
            "${APP_PATH}" \
            "${COMPOSE_PROJECT_NAME}" \
            "${COMPOSE_ENVIRONMENT}" \
            "${RELEASE_SERVICE}" \
            "${RELEASE_IMAGE}" \
            "${RELEASE_TAG}" \
            "${GHCR_USERNAME}" \
            "${GHCR_TOKEN}"

          ssh "${SSH_USER}@${SSH_HOST}" "${REMOTE_CMD}" \
            < .github/scripts/remote-deploy.sh

      # Docker `--wait` validates the internal container healthchecks.
      # This second check validates the complete public path:
      # host Caddy -> Docker published port -> FrankenPHP -> application.
      - name: External HTTP healthcheck
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --retry 12 \
            --retry-delay 5 \
            --retry-all-errors \
            "${APP_URL%/}/health"

      # Only a healthy release becomes CURRENT. server-release automatically
      # moves the former CURRENT value to PREVIOUS.
      - name: Record successful release
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          printf -v REMOTE_CMD \
            'server-release record %q %q %q %q' \
            "${APP_NAME}" \
            "${RELEASE_SERVICE}" \
            "${RELEASE_TAG}" \
            "${RELEASE_IMAGE}"

          ssh "${SSH_USER}@${SSH_HOST}" "${REMOTE_CMD}"

      - name: Show release state
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          printf -v REMOTE_CMD 'server-release show %q' "${APP_NAME}"
          ssh "${SSH_USER}@${SSH_HOST}" "${REMOTE_CMD}"

      - name: Remove local secret bundle
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/deploy" "${RUNNER_TEMP}/deploy.tar.gz"
