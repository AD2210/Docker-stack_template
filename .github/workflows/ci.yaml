name: CI

on:
  push:
    branches:
      - develop
      - 'release/**'
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'support/**'
    paths-ignore:
      - 'docs/**'
      - README.md
      - CHANGELOG.md
      - LICENSE
  workflow_dispatch:
    inputs:
      full_validation:
        description: 'Run full release validation, including browser audits when configured'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/_quality.yaml
    with:
      full: ${{ github.event_name == 'workflow_dispatch' && inputs.full_validation }}
