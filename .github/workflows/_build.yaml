name: _Build

on:
  workflow_call:
    inputs:
      sha:
        description: Exact validated commit
        required: true
        type: string
      tag:
        description: "SEMVER release tag (example: V1.2.3)"
        required: true
        type: string
      environment:
        description: "Build environment: preprod or prod"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The project Makefile remains authoritative for:
      # - APP_ENV build argument
      # - IMAGES_PREFIX
      # - Compose files / overrides
      # - image names
      #
      # IMAGE_TAG is the Git SEMVER tag and is the only release identifier
      # supplied by GitHub Actions.
      - name: Build and push images
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          BUILD_ENV: ${{ inputs.environment }}
          IMAGE_TAG: ${{ inputs.tag }}
          IMAGES_PREFIX: ghcr.io/${{ github.repository }}-
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          export IMAGES_PREFIX="${IMAGES_PREFIX,,}"
          bash .github/scripts/assert-image-absent.sh "${IMAGES_PREFIX}app-php-${BUILD_ENV}" "$IMAGE_TAG"
          case "${BUILD_ENV}" in
            preprod)
              make preprod-build IMAGE_TAG="${IMAGE_TAG}"
              make preprod-push IMAGE_TAG="${IMAGE_TAG}"
              ;;
            prod)
              make prod-build IMAGE_TAG="${IMAGE_TAG}"
              make prod-push IMAGE_TAG="${IMAGE_TAG}"
              ;;
            *)
              echo "::error::Unknown build environment: ${BUILD_ENV}"
              exit 1
              ;;
          esac

      # ---------------------------------------------------------------------
      # Optional additional image services
      # ---------------------------------------------------------------------
      # Keep the service selection in Compose/Make rather than duplicating it
      # here. Messenger and Scheduler should normally reuse the PHP image with
      # different Compose commands. A Vue/front image can be added to the Make
      # build/push targets when required.
