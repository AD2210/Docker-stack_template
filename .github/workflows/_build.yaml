name: _Build

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.3"
        required: true
        type: string
    outputs:
      image:
        description: "Published PHP image"
        value: ${{ jobs.php.outputs.image }}
      digest:
        description: "Published PHP image digest"
        value: ${{ jobs.php.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  php:
    name: Build PHP image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}-php

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          echo "image=${IMAGE}:${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build and push PHP image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: frankenphp_prod
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
          cache-from: type=gha,scope=php-release
          cache-to: type=gha,scope=php-release,mode=max
          provenance: true
          sbom: true

      # -----------------------------------------------------------------------
      # Optional additional buildable services
      # -----------------------------------------------------------------------
      # Add one job per independently versioned image, or move to a matrix.
      # Messenger/Scheduler should normally reuse the PHP image with a different
      # Compose command rather than producing separate images.
