name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to release (example: v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG}"
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            SHA="$(git rev-list -n 1 "${TAG}")"
          else
            TAG="${REF_NAME}"
            SHA="${GITHUB_SHA}"
          fi

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid SEMVER release tag: ${TAG}"
            exit 1
          fi

          git fetch origin main

          if ! git merge-base --is-ancestor "${SHA}" origin/main; then
            echo "::error::Tag ${TAG} does not point to a commit reachable from main."
            exit 1
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  quality:
    name: Quality
    needs: validate-release
    uses: ./.github/workflows/_quality.yaml

  build-preprod:
    name: Build preprod
    needs:
      - validate-release
      - quality
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yaml
    with:
      tag: ${{ needs.validate-release.outputs.tag }}
      environment: preprod

  build-production:
    name: Build production
    needs:
      - validate-release
      - quality
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yaml
    with:
      tag: ${{ needs.validate-release.outputs.tag }}
      environment: prod

  deploy-preprod:
    name: Deploy preprod
    needs:
      - validate-release
      - build-preprod
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_deploy.yaml
    with:
      tag: ${{ needs.validate-release.outputs.tag }}
      environment: preprod
      compose_environment: preprod
    secrets: inherit

  deploy-production:
    name: Deploy production
    needs:
      - validate-release
      - build-production
      - deploy-preprod
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_deploy.yaml
    with:
      tag: ${{ needs.validate-release.outputs.tag }}
      environment: production
      compose_environment: prod
    secrets: inherit
