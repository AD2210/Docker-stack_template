name: _Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Compose configurations
        run: make check-compose

      - name: Validate host Caddy configuration
        run: |
          docker run --rm \
            --volume "${PWD}:/srv:ro" \
            --mount type=tmpfs,destination=/srv/var \
            --workdir /srv \
            caddy:2 \
            caddy validate --config /srv/Caddyfile --adapter caddyfile

      - name: Validate FrankenPHP Caddy configuration
        run: make check-caddy-frankenphp

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

  lint:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2
          extensions: intl, pdo_pgsql, sodium, zip

      - name: Restore Composer cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run linters and static analysis
        run: make lint

  tests:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2
          extensions: intl, pdo_pgsql, sodium, zip

      - name: Restore Composer cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: make test

