name: _Quality

on:
  workflow_call:
    inputs:
      sha:
        description: Exact commit to test
        type: string
        default: ''
      full:
        description: Full release validation; mandatory for tagged releases
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Static analysis and tests
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select infrastructure checks
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.before }}
          CI_HEAD_SHA: ${{ inputs.sha || github.sha }}
        run: python3 tools/ci_scope.py >> "$GITHUB_OUTPUT"
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: intl, pdo_pgsql, pdo_sqlite, sodium, mbstring, dom, gd, zip
      - name: Restore Composer cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php85-
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Validate infrastructure
        if: inputs.full || steps.scope.outputs.infrastructure == 'true'
        run: |
          make check-compose
          docker run --rm --volume "${PWD}:/srv:ro" --mount type=tmpfs,destination=/srv/var --workdir /srv caddy:2 caddy validate --config /srv/Caddyfile --adapter caddyfile
          make check-caddy-frankenphp
      - name: Restore PHPStan analysis cache
        uses: actions/cache@v6
        with:
          path: var/phpstan
          key: phpstan-${{ runner.os }}-php85-${{ hashFiles('composer.lock', 'phpstan*.neon') }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            phpstan-${{ runner.os }}-php85-${{ hashFiles('composer.lock', 'phpstan*.neon') }}-${{ github.ref_name }}-
      - name: Run linters and backend tests
        run: |
          make lint
          make test
